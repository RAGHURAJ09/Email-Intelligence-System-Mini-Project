services:
  # Backend Web Service
  - type: web
    name: customer-email-ai-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: customer-email-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://customer-email-ai-frontend.onrender.com"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: DAYTONA_API_KEY
        sync: false

  # Frontend Static Site
  - type: static_site
    name: customer-email-ai-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: customer-email-ai-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: customer-email-db
    databaseName: email_ai
    user: email_admin
